<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Обложка курса по математическому анализу">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#321ec8"/>
      <stop offset="0.55" stop-color="#4c37e1"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#bbb4f4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bbb4f4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="480" height="270" fill="url(#bg)"/>
  <rect width="480" height="270" fill="url(#glow)"/>

  <!-- faint coordinate grid -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
    <path d="M40 0V270M100 0V270M160 0V270M220 0V270M280 0V270M340 0V270M400 0V270M460 0V270"/>
    <path d="M0 30H480M0 70H480M0 110H480M0 150H480M0 190H480M0 230H480"/>
  </g>

  <!-- axes -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M40 230H452"/>
    <path d="M40 36V236"/>
  </g>

  <!-- tangent line (dashed) -->
  <path d="M196 244 L388 92" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- parabola curve with soft glow -->
  <path d="M70 92 Q210 312 430 78" fill="none" stroke="#e7e4fb" stroke-opacity="0.45" stroke-width="9" filter="url(#soft)"/>
  <path d="M70 92 Q210 312 430 78" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- point of tangency -->
  <circle cx="292" cy="168" r="9" fill="#6c5ce7" stroke="#ffffff" stroke-width="3"/>

  <!-- label -->
  <text x="40" y="60" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#ffffff" fill-opacity="0.92">f &#8242;(x) = tan&#945;</text>
</svg>
